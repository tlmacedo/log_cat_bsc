[package]
name = "log-cat-bsc-desktop"
version = "0.1.0"
description = "Log Viewer - wrapper desktop (Mac/Windows) do mesmo backend Flask usado na versao web"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "log-cat-bsc"
path = "src/main.rs"
